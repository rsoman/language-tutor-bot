name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Audit dependencies
        # pip-audit has no severity filter, so any known vulnerability fails the build.
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: API schemas match the backend (ADR 0004)
        # Regenerates openapi.json and the Zod schemas; fails if the committed copies differ.
        run: |
          bash scripts/export-openapi.sh
          git diff --exit-code -- openapi.json src/api/generated
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Acceptance tests (Playwright BDD)
        run: pnpm e2e
      - name: Upload screenshots for review (delivery.md)
        # The screenshots project saves each mode at the three D0004 breakpoints. Never committed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: frontend/screenshots/
          if-no-files-found: warn
          retention-days: 14
