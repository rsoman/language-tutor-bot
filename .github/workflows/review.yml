name: Review

# The reviewer agent (docs/conventions/review.md). Needs the CLAUDE_CODE_OAUTH_TOKEN secret,
# generated with `claude setup-token` on a Pro or Max subscription. Without it, the job is skipped.

# It runs when a PR opens, reopens or leaves draft, and again when someone adds the
# `re-review` label (owner's decision, 2026-11-28: a run on every push cost too many tokens).
# The label is removed after the run, so adding it again starts another review.
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 're-review')
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without token
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not set, so the reviewer agent is skipped."

      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the independent reviewer agent. The PR branch is checked out.
            Follow .claude/skills/review/SKILL.md exactly.

            Post the summary with `gh pr comment` and file-specific findings with
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
            Finally write the verdict to the file review-verdict.txt as one line:
            `blocking=<number of blocking findings>`.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*)"

      - name: Remove the re-review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label re-review

      - name: Fail on blocking findings
        if: env.HAS_TOKEN == 'true'
        run: |
          test -f review-verdict.txt || { echo "The reviewer wrote no verdict."; exit 1; }
          cat review-verdict.txt
          grep -qx 'blocking=0' review-verdict.txt
